name: CI Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Test (.NET 10)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: PergamonLensDb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d PergamonLensDb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: ⚙️ Set up .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 📦 Restore dependencies
        run: dotnet restore PergamonLens.slnx

      - name: 🔨 Build solution
        run: dotnet build PergamonLens.slnx --no-restore --configuration Release

      - name: 🧪 Run tests (Unit + Integration with PostgreSQL)
        env:
          ConnectionStrings__DefaultConnection: "Host=localhost;Port=5432;Database=PergamonLensDb;Username=postgres;Password=postgres"
        run: dotnet test PergamonLens.slnx --no-build --configuration Release --verbosity normal

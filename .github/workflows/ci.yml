name: CI Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Test (.NET 10)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: ⚙️ Set up .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 📦 Restore dependencies
        run: dotnet restore PergamonLens.slnx

      - name: 🔨 Build solution
        run: dotnet build PergamonLens.slnx --no-restore --configuration Release

      - name: 🧪 Run tests
        run: dotnet test PergamonLens.slnx --no-build --configuration Release --verbosity normal
